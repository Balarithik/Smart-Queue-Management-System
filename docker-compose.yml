# Local full stack: PostgreSQL + all-in-one web (same image as Render Docker)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sqms
      POSTGRES_PASSWORD: sqms
      POSTGRES_DB: sqms
    volumes:
      - sqms_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sqms -d sqms"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://sqms:sqms@db:5432/sqms
      SECRET_KEY: docker-compose-dev-secret-replace-in-real-deployment-min-50-chars
      ALLOWED_HOSTS: localhost,127.0.0.1,web
      FRONTEND_ORIGIN: http://localhost:8080
      CORS_ALLOWED_ORIGINS: http://localhost:8080
      CSRF_TRUSTED_ORIGINS: http://localhost:8080
      SECURE_SSL_REDIRECT: "false"
      SERVE_MEDIA: "true"
      DEBUG: "False"
      DJANGO_SETTINGS_MODULE: config.settings.production
    depends_on:
      db:
        condition: service_healthy

volumes:
  sqms_pgdata:
