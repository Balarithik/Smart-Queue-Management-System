services:
  db:
    image: postgres:16.11-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sqms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sqms}
      POSTGRES_DB: ${POSTGRES_DB:-sqms}
    volumes:
      # Named volume version bump: if Postgres was initialized with old credentials,
      # bump this name or run `docker compose down -v` so init creates POSTGRES_* users.
      - sqms_pgdata_v2:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sqms} -d ${POSTGRES_DB:-sqms}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DATABASE_URL: ${DATABASE_URL:-postgres://sqms:sqms@db:5432/sqms}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me-generate-a-strong-key-for-production}
      DEBUG: ${DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=5)",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 45s

  frontend:
    profiles: ["dev"]
    build:
      context: ./frontend
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    depends_on:
      backend:
        condition: service_healthy

volumes:
  sqms_pgdata_v2:
