# Smart Queue Management System — example Nginx site (HTTP).
# TLS: terminate SSL at Nginx or a load balancer and set SECURE_SSL_REDIRECT on Django.
#
# Paths (adjust for your host):
#   /var/www/sqms/frontend  — Vite build output (frontend/dist)
#   /var/www/sqms/media     — Django MEDIA_ROOT (QR images, uploads)

upstream sqms_api {
    server 127.0.0.1:8000;
    # Docker Compose: use service name, e.g. server backend:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name localhost;

    client_max_body_size 10M;

    root /var/www/sqms/frontend;
    index index.html;

    # React SPA — client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Django API + admin + WhiteNoise static
    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://sqms_api;
    }

    location /admin/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://sqms_api;
    }

    location /static/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://sqms_api;
    }

    # User-generated media (QR codes) — served directly by Nginx in production
    location /media/ {
        alias /var/www/sqms/media/;
        expires 7d;
        add_header Cache-Control "public";
    }
}
