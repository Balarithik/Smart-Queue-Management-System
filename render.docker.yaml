# Render Blueprint — single Docker image (API + SPA + Nginx)
# Create Blueprint from repo, link PostgreSQL, set env vars marked sync: false.
# Alternative: non-Docker deploy uses root render.yaml (Python + static site).

databases:
  - name: sqms-db
    databaseName: sqms
    user: sqms
    plan: free

services:
  - type: web
    name: sqms-docker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: sqms-db
          property: connectionString
      - key: ALLOWED_HOSTS
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: SECURE_SSL_REDIRECT
        value: "true"
      - key: SERVE_MEDIA
        value: "true"
