# Render Blueprint — https://render.com/docs/blueprint-spec
# Adjust service names and env values before deploying.

services:
  - type: web
    name: sqms-api
    runtime: python
    rootDir: backend
    buildCommand: ./build.sh
    startCommand: gunicorn wsgi:application --config gunicorn.conf.py
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: sqms-db
          property: connectionString
      - key: ALLOWED_HOSTS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: SECURE_SSL_REDIRECT
        value: "true"
      - key: SERVE_MEDIA
        value: "true"

  - type: web
    name: sqms-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false

databases:
  - name: sqms-db
    databaseName: sqms
    user: sqms
    plan: free
