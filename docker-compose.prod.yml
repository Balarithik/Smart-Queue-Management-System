# Production stack: PostgreSQL + Gunicorn (Django) + Nginx (SPA + API proxy + media).
#
# From repository root:
#   copy .env.example .env
#   set SECRET_KEY, ALLOWED_HOSTS, CORS_ALLOWED_ORIGINS, FRONTEND_ORIGIN, VITE_API_BASE_URL
#   docker compose -f docker-compose.prod.yml up --build
#
# App URL: http://localhost  (override NGINX_HTTP_PORT in .env)

services:
  db:
    image: postgres:16.11-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sqms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sqms}
      POSTGRES_DB: ${POSTGRES_DB:-sqms}
    volumes:
      - sqms_pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sqms} -d ${POSTGRES_DB:-sqms}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    expose:
      - "8000"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DATABASE_URL: ${DATABASE_URL:-postgres://sqms:sqms@db:5432/sqms}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      DEBUG: "False"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend,nginx}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-False}
    volumes:
      - sqms_media:/app/media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=5); exit(0 if r.status==200 else 1)",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 45s

  nginx:
    build:
      context: .
      dockerfile: deploy/Dockerfile.nginx
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost}
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    volumes:
      - sqms_media:/var/www/sqms/media:ro
    depends_on:
      backend:
        condition: service_healthy

volumes:
  sqms_pgdata_prod:
  sqms_media:
